# Calisthenics / strength-science Shorts: 9:16 page = title on top, 16:9 ink picture framed in the middle,
# one bouncing word at a time below (same page layout as the psychology channel).
# Pictures are generated here in landscape 16:9 so the frame never crops them; the n8n flow sets header.text.
features: {images: true, popups: true}
text_color: "#111111"
accent: "#2EE6D6"
uppercase: true
palette:
  - ["#ffffff", "#ffffff"]
motion_default: auto
transition_default: whip
transition_duration: 0.2
layout: {frame: true, frame_w: 96, frame_top: 33, header_top: 9, cap_top: 66}
header: {size_pct: 0.036}
captions: {style: word, position: lower, max_words: 1, max_chars: 22, size_pct: 0.04}
captions_landscape: {style: word, max_words: 1, size_pct: 0.04}
look: {grade: none, vignette: 0, grain: 0, letterbox: 0, shade: false}
sfx: {enabled: true, auto: false, gain: 1.0, transition_query: whoosh}
tail_seconds: 0.8
image:
  send_size: false
  extra_body: {width: 1664, height: 928}
  prompt_prefix: "Black-and-white manga-style ink illustration on a pure black background, crisp white linework with fine cross-hatching and dramatic rim lighting, one cyan accent color, wide cinematic 16:9 composition with the subject centered and clean empty space around it. Recurring character KAI: a lean athletic young man with swept-back hair, bare torso, cyan shorts and cyan wrist wraps, drawn in white ink line art. "
  negative_prompt: "text, letters, numbers, watermark, logo, signature, blurry, gray background, white background, color photo, 3d render, blood, gore"
