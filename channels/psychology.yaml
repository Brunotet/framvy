# Science + psychology explainers. Images come from the n8n flow (URLs), never generated here.
features: {images: true, popups: true}
accent: "#FFD400"
palette:
  - ["#ffffff", "#ffffff"]
motion_default: auto
transition_default: whip
transition_duration: 0.2
# one word at a time, bouncy pop-in / pop-out
captions: {style: word, position: lower, max_words: 1, max_chars: 22, size_pct: 0.1}
captions_landscape: {style: word, max_words: 1, size_pct: 0.1}
look: {grade: none, vignette: 0, grain: 0, letterbox: 0}
sfx: {enabled: true, auto: true, gain: 0.7, transition_query: whoosh}
tail_seconds: 0.8
