name: build-icons
# Downloads the whole lucide icon set (about 1500 icons) under data/icons for code-drawn map scenes.
on:
  workflow_dispatch:
  push:
    paths: ['scripts/build_icons.py']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/build_icons.py
      - run: |
          git config user.name "builder"; git config user.email "builder@users.noreply.github.com"
          git add data
          git commit -m "lucide icon set" || echo nothing
          git pull --rebase -q || true
          git push || true
