name: render-video

# n8n triggers this with the GitHub API (same contract as your other pipelines):
#   POST /repos/Brunotet/framvy/actions/workflows/render.yml/dispatches
#   {"ref":"main","inputs":{"channel":"...","payload_b64":"<base64 job>","render_id":"...","callback_url":"<Wait resume URL>","skip_upload":"false"}}
# The finished video is PUT to the presigned R2 URL inside the job; the result is POSTed to callback_url.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Channel profile name"
        required: false
        default: ""
      payload_b64:
        description: "Base64 of the job JSON (from n8n)"
        required: false
        default: ""
      render_id:
        description: "Render id (becomes the job id)"
        required: false
        default: ""
      callback_url:
        description: "n8n Wait-node resume URL, called when the render ends"
        required: false
        default: ""
      skip_upload:
        description: "true = do not upload to R2"
        required: false
        default: "false"
      job_json:
        description: "Manual test: the job as a JSON string"
        required: false
        default: ""
      job_url:
        description: "Manual test: URL of a job JSON file"
        required: false
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: System deps (ffmpeg + fonts)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y ffmpeg fonts-dejavu fonts-liberation fonts-noto-color-emoji

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pip install -r requirements.txt

      - name: Install HyperFrames (Apache-2.0, no per-render fees)
        run: |
          npm install --no-audit --no-fund
          npx hyperframes browser ensure || true

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - run: python -m playwright install --with-deps chromium

      - name: Write job file
        env:
          PAYLOAD_B64: ${{ inputs.payload_b64 }}
          JOB_JSON: ${{ inputs.job_json }}
          JOB_URL: ${{ inputs.job_url }}
        run: |
          if [ -n "$PAYLOAD_B64" ]; then printf '%s' "$PAYLOAD_B64" | base64 -d > job.json
          elif [ -n "$JOB_JSON" ]; then printf '%s' "$JOB_JSON" > job.json
          elif [ -n "$JOB_URL" ]; then curl -fsSL "$JOB_URL" -o job.json
          else echo "need payload_b64, job_json or job_url" && exit 1; fi

      - name: Render
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          RENDER_ID: ${{ inputs.render_id }}
          CHANNEL: ${{ inputs.channel }}
          SKIP_UPLOAD: ${{ inputs.skip_upload }}
          MODAL_TTS_URL: ${{ secrets.MODAL_TTS_URL }}        # optional: defaults to your Chatterbox endpoint
          QWEN_IMAGE_URL: ${{ secrets.QWEN_IMAGE_URL }}      # optional: defaults to your Qwen Image 2.1 endpoint
          QWEN_BATCH_URL: ${{ secrets.QWEN_BATCH_URL }}      # optional: defaults to the batch URL in channels/default.yaml
          FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
        run: |
          python -m editor.cli --job job.json --callback-url "$CALLBACK_URL" --render-id "$RENDER_ID" \
            --channel "$CHANNEL" --skip-upload "$SKIP_UPLOAD"

      - name: Tell n8n if the workflow itself crashed
        if: failure() && inputs.callback_url != ''
        env:
          CALLBACK_URL: ${{ inputs.callback_url }}
          RENDER_ID: ${{ inputs.render_id }}
        run: |
          curl -s -X POST -H 'Content-Type: application/json' \
            -d "{\"status\":\"error\",\"job_id\":\"$RENDER_ID\",\"error\":\"GitHub workflow failed before the render finished. Open the Actions run for details.\"}" \
            "$CALLBACK_URL" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-output
          path: out/**
          retention-days: 7
